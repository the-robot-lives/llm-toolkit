name: ci

on:
  push:
    branches: [main, develop, stage]
  pull_request:

# Supersede stale PR runs; never cancel main/develop pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vitest across the pnpm workspace (shared, cli, api, web). Provider keys are
  # stripped by test/strip-provider-env.ts; per-package line gates live in each
  # packages/*/vitest.config.ts. The /api/memory route suite self-skips without
  # the napi addon (TEST-HEALTH debt).
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test + coverage gate
        run: pnpm -r test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-js
          path: packages/*/coverage/coverage-summary.json
          if-no-files-found: ignore

  # Two independent cargo workspaces. claude-memory-node (napi cdylib) is built
  # by `pnpm build:memory-native`, not tested here.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: skill-manage
            dir: skill-manage
            args: ""
            min_lines: 19
          - name: claude-memory
            dir: crates
            args: "-p claude-memory"
            min_lines: 88
    name: rust (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: ${{ matrix.dir }}
          shared-key: ${{ matrix.name }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage gate
        working-directory: ${{ matrix.dir }}
        run: cargo llvm-cov --locked ${{ matrix.args }} --fail-under-lines ${{ matrix.min_lines }}


  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [js, rust]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^(js|rust)$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
